site_name: Eksamensrelevant 4C
docs_dir: site_src
theme:
  name: material
  language: nb
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
